plugins {
    id 'com.android.application'
    id 'com.facebook.react'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zaycomm.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zaycomm.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        // Standalone diagnostic APK: release-like React Native behavior
        // (bundled JS, no Metro dependency) while remaining installable with
        // the standard debug signing key. This is for device validation only.
        diagnostic {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    // React Native 0.86's Gradle plugin owns the New Architecture native
    // integration. Zaycomm currently has no app-owned C++ targets, so do not
    // override it with a second application CMake entry point.
}

react {
    autolinkLibrariesWithApp()
}

dependencies {
    // React Native 0.86.2 runtime artifacts required by generated sources.
    implementation('com.facebook.react:react-android')

    if (hermesEnabled.toBoolean()) {
        implementation('com.facebook.react:hermes-android')
    }

    // ReactActivity extends AppCompatActivity and therefore requires an
    // AppCompat theme at runtime.
    implementation('androidx.appcompat:appcompat:1.7.0')

    // Stage 2 QR scanner foundation: CameraX provides the Android camera
    // lifecycle/preview pipeline.
    implementation('androidx.camera:camera-core:1.4.2')
    implementation('androidx.camera:camera-camera2:1.4.2')
    implementation('androidx.camera:camera-lifecycle:1.4.2')
    implementation('androidx.camera:camera-view:1.4.2')

    // Stage 2 QR decoding foundation. Decoder integration is intentionally
    // separate from the camera/preview implementation.
    implementation('com.google.mlkit:barcode-scanning:17.3.0')
}

// C25.4 debug APK: installable on a physical Android device for BLE validation.
// Release signing is intentionally left to the eventual distribution pipeline.
