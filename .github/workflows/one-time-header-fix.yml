name: One-time Zaycomm header and theme fix
on:
  push:
    branches: [Test]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[theme-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile appearance and header/status UI
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('mobile/AppV2.tsx')
          s = p.read_text()

          if "import {SvgXml} from 'react-native-svg';" not in s:
              s = s.replace("import QRCode from 'react-native-qrcode-svg';", "import QRCode from 'react-native-qrcode-svg';\nimport {SvgXml} from 'react-native-svg';")

          marker = "const ui = Platform.OS === 'android' ? 'sans-serif' : undefined;"
          logo = '''\nconst ZAYCOMM_LOGO_SVG = `<?xml version="1.0" encoding="UTF-8"?>\n<svg viewBox="0 0 1170 788" xmlns="http://www.w3.org/2000/svg">\n<defs><linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#4ADE9C"/><stop offset="50%" stop-color="#3BC9C9"/><stop offset="100%" stop-color="#4FA8F0"/></linearGradient></defs>\n<rect width="1170" height="788" fill="#060A18"/>\n<g stroke="url(#dotGrad)" stroke-width="10" stroke-linecap="round" opacity="0.9"><line x1="505" y1="335" x2="595" y2="300"/><line x1="505" y1="435" x2="595" y2="395"/><line x1="505" y1="435" x2="505" y2="540"/></g>\n<g fill="url(#dotGrad)"><circle cx="410" cy="297" r="13"/><circle cx="410" cy="398" r="13"/><circle cx="410" cy="495" r="13"/><circle cx="505" cy="247" r="15"/><circle cx="505" cy="335" r="28"/><circle cx="505" cy="435" r="28"/><circle cx="505" cy="540" r="16"/><circle cx="595" cy="205" r="15"/><circle cx="595" cy="300" r="28"/><circle cx="595" cy="395" r="28"/><circle cx="595" cy="497" r="19"/><circle cx="595" cy="595" r="15"/><circle cx="672" cy="250" r="14"/><circle cx="680" cy="345" r="21"/><circle cx="672" cy="450" r="21"/><circle cx="672" cy="550" r="18"/><circle cx="763" cy="297" r="14"/><circle cx="763" cy="398" r="14"/><circle cx="763" cy="497" r="14"/></g></svg>`;\n'''
          if 'const ZAYCOMM_LOGO_SVG' not in s:
              s = s.replace(marker, marker + logo)

          old = """function StatePill({state}: {state: ProtocolState}) {\n  const live = state !== 'IDLE';\n  return <View style={[styles.statePill, live && styles.statePillLive]}><Pulse active={live} /><Text style={styles.statePillText}>{state}</Text></View>;\n}"""
          new = """function StatusDot({state}: {state: ProtocolState}) {\n  const active = state !== 'IDLE';\n  const color = state === 'IDLE' ? '#5f6685' : state === 'SCANNING' || state === 'LINKING' ? '#f4b740' : '#4ade80';\n  return <View style={styles.statusDotWrap}><Pulse active={active} /><View style={[styles.statusDot, {backgroundColor: color}]} /></View>;\n}"""
          s = s.replace(old, new).replace('<StatePill state={state} />', '<StatusDot state={state} />')

          pattern = re.compile(r"    <View style=\{styles\.heroRow\}><View><Text style=\{styles\.eyebrow\}>LOCAL NODE</Text><Text style=\{styles\.heroTitle\}>\{identity \? nodeName : 'ZAYCOMM'\}</Text><Text style=\{styles\.heroSub\}>\{identity \? 'IDENTITY READY / OFFLINE MESH' : 'INITIAL SETUP'\}</Text></View><StatusDot state=\{state\} /></View>")
          replacement = """    <View style={styles.brandHeader}><SvgXml xml={ZAYCOMM_LOGO_SVG} width={28} height={20} /><Text style={styles.brandWordmark}>ZAYCOMM</Text><StatusDot state={state} /></View>\n    <View style={styles.heroRow}><View><Text style={styles.heroTitle}>{identity ? nodeName : 'ZAYCOMM'}</Text><Text style={styles.heroSub}>{identity ? 'IDENTITY READY / OFFLINE MESH' : 'INITIAL SETUP'}</Text></View></View>"""
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Home hero pattern not found: {n}')

          s = s.replace('<View style={styles.nodeCard}><View style={styles.rowBetween}>', '<View style={styles.nodeCard}><Text style={styles.eyebrow}>LOCAL NODE</Text><Text style={styles.cardTitle}>{nodeName}</Text><View style={styles.rowBetween}>', 1)
          s = s.replace('<View style={styles.rowBetween}><Text style={styles.eyebrow}>TRANSPORT</Text><Text style={styles.stateText}>{state}</Text></View>', '<Text style={styles.eyebrow}>TRANSPORT</Text>')

          old_colors = "const COLORS = {bg: '#080c22', surface: '#121a3d', border: '#212b57', ink: '#eef1ff', dim: '#8891bd', signal: '#57e0ff', pulse: '#7c6bff'};"
          new_colors = """const DARK_COLORS = {bg: '#080c22', surface: '#121a3d', border: '#212b57', ink: '#eef1ff', dim: '#8891bd', signal: '#57e0ff', pulse: '#7c6bff'};\nconst LIGHT_COLORS = {bg: '#f7f8fc', surface: '#ffffff', border: '#e1e5f2', ink: '#101425', dim: '#6b7290', signal: '#0ea5c4', pulse: '#6355d6'};\nlet COLORS = DARK_COLORS;\nlet styles: any;"""
          if old_colors in s:
              s = s.replace(old_colors, new_colors, 1)

          s = s.replace("export default function AppV2() {\n  const [loading, setLoading] = useState(true);", "export default function AppV2() {\n  const [loading, setLoading] = useState(true);\n  const [theme, setTheme] = useState<'dark' | 'light'>('dark');")
          s = s.replace("  const bridgeAvailable = !!nativeBle;", "  COLORS = theme === 'light' ? LIGHT_COLORS : DARK_COLORS;\n  styles = makeStyles();\n\n  const bridgeAvailable = !!nativeBle;", 1)

          s = s.replace("const styles = StyleSheet.create({", "const makeStyles = () => StyleSheet.create({", 1)

          appearance = """    <View style={styles.card}><Text style={styles.section}>Appearance</Text><Text style={styles.cardText}>Choose how Zaycomm looks. Dark keeps the night-ops interface; Light uses a high-visibility neutral surface.</Text><View style={styles.themeRow}><Pressable style={[styles.themeOption, theme === 'dark' && styles.themeOptionActive]} onPress={() => setTheme('dark')}><Text style={[styles.themeOptionText, theme === 'dark' && styles.themeOptionTextActive]}>DARK</Text></Pressable><Pressable style={[styles.themeOption, theme === 'light' && styles.themeOptionActive]} onPress={() => setTheme('light')}><Text style={[styles.themeOptionText, theme === 'light' && styles.themeOptionTextActive]}>LIGHT</Text></Pressable></View></View>\n"""
          settings_marker = "    <View style={styles.card}><Text style={styles.section}>Transport</Text>"
          if 'Choose how Zaycomm looks.' not in s:
              s = s.replace(settings_marker, appearance + settings_marker, 1)

          style_marker = "  heroRow: {"
          styles = """  brandHeader: {flexDirection: 'row', alignItems: 'center', minHeight: 34, marginBottom: 18, gap: 8},\n  brandWordmark: {fontFamily: ui, fontSize: 15, fontWeight: '700', letterSpacing: 2.4, color: COLORS.ink},\n  statusDotWrap: {width: 18, height: 18, alignItems: 'center', justifyContent: 'center', marginLeft: 2},\n  statusDot: {width: 8, height: 8, borderRadius: 4},\n  themeRow: {flexDirection: 'row', gap: 8, marginTop: 14},\n  themeOption: {flex: 1, minHeight: 42, borderRadius: 12, borderWidth: 1, borderColor: COLORS.border, alignItems: 'center', justifyContent: 'center', backgroundColor: COLORS.bg},\n  themeOptionActive: {backgroundColor: COLORS.signal, borderColor: COLORS.signal},\n  themeOptionText: {fontFamily: mono, fontSize: 11, fontWeight: '600', color: COLORS.dim, letterSpacing: 1},\n  themeOptionTextActive: {color: '#04101c'},\n"""
          if 'themeOption:' not in s:
              s = s.replace(style_marker, styles + style_marker, 1)

          s = s.replace('<View style={styles.splashMark}><Text style={styles.splashGlyph}>Z</Text></View>', '<View style={styles.splashMark}><SvgXml xml={ZAYCOMM_LOGO_SVG} width={110} height={74} /></View>')
          p.write_text(s)
      - name: Commit theme fix
        run: |
          git config user.name 'Zaygal'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/AppV2.tsx .github/workflows/one-time-header-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Apply Zaycomm light and dark appearance mode [theme-applied]'
          git push
