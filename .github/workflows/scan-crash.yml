name: Scan-QR crash reproduction

# Dispatch-only, on purpose. This job installs an APK, drives the UI, and reads
# logcat; it should never run because someone pushed. Same reasoning as the other
# reproduction job in this repo.
#
# It reuses the already-built diagnostic APK rather than rebuilding, so it
# reproduces against the exact binary that is failing on the device.
on:
  workflow_dispatch:

jobs:
  scan-crash:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Resolve the newest successful APK rather than a pinned run id. The
      # previous version hard-coded a run and silently tested an older binary
      # than the one on the device - a reproduction that tests the wrong build
      # is worse than none, because it looks like evidence.
      - name: Resolve the newest diagnostic APK
        id: apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android-debug-apk.yml                   --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RID" ]; then echo "no successful APK build found"; exit 1; fi
          echo "Using APK from run $RID"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"

      - name: Download the APK that is failing on the device
        uses: actions/download-artifact@v4
        with:
          name: zaycomm-diagnostic-apk
          path: apk
          run-id: ${{ steps.apk.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm what we are testing
        run: |
          ls -la apk/
          sha256sum apk/*.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Reboot emulator, drive to the scan button, capture the crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          # An emulated back camera on purpose: the device that fails has one, and
          # a missing camera would change the code path we are trying to reproduce.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back emulated -camera-front none
          script: bash "$GITHUB_WORKSPACE/.github/scripts/scan-crash.sh" "$GITHUB_WORKSPACE"/apk/*.apk

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-crash-logcat
          path: scan-crash-logcat.txt
          if-no-files-found: warn
