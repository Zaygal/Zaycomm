# Baseline APK test trigger — no build logic changed.
name: Android debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-debug-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install mobile dependencies
        run: npm install

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image already ships the Android SDK, and
      # android-actions/setup-android@v3 now fails because the "tools" package
      # it bootstraps is no longer published. Use the preinstalled SDK instead:
      # sdkmanager is not on PATH, so locate it, and skip when the required
      # packages are already in the image.
      - name: Install Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$SDK/platforms/android-35" ] && [ -d "$SDK/build-tools/35.0.0" ]; then
            echo "Required SDK packages already present in the runner image."
            exit 0
          fi
          SDKMANAGER="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK; relying on packages already installed."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
          cache-read-only: false
          cache-cleanup: on-success

      - name: Build standalone diagnostic APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.repository.max.retries=5
            -Dorg.gradle.internal.repository.initial.backoff=2000
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if gradle --no-daemon --stacktrace :app:assembleDiagnostic; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle attempt ${attempt} failed; waiting before retry..."
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Verify diagnostic APK contains React Native bundle
        working-directory: mobile/android
        run: |
          set -e
          APK="app/build/outputs/apk/diagnostic/app-diagnostic.apk"
          test -f "$APK"
          echo "Inspecting $APK"
          if ! unzip -l "$APK" | grep -Eq 'assets/(index\.android\.bundle|index\.android\.bundle\.packager\.map)$'; then
            echo "ERROR: React Native Android bundle is missing from diagnostic APK."
            echo "APK assets containing bundle/map entries:"
            unzip -l "$APK" | grep -E 'assets/|bundle|\.map' | head -80 || true
            exit 1
          fi
          echo "React Native Android bundle is present in diagnostic APK."

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: zaycomm-diagnostic-apk
          path: mobile/android/app/build/outputs/apk/diagnostic/app-diagnostic.apk
          if-no-files-found: error
