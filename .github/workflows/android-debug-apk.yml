# Baseline APK test trigger — no build logic changed.
name: Android debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-debug-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install mobile dependencies
        run: npm install

      - name: Guard against imports this version does not export
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/import-guard.py"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image already ships the Android SDK, and
      # android-actions/setup-android@v3 now fails because the "tools" package
      # it bootstraps is no longer published. Use the preinstalled SDK instead:
      # sdkmanager is not on PATH, so locate it, and skip when the required
      # packages are already in the image.
      - name: Install Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$SDK/platforms/android-36" ] && [ -d "$SDK/build-tools/36.0.0" ]; then
            echo "Required SDK packages already present in the runner image."
            exit 0
          fi
          SDKMANAGER="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK; relying on packages already installed."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # The pinned NDK must be installed, and its libc++ must actually export the
      # symbol nitro's compiled output needs. Assert both here, in the build that
      # produces the artifact, rather than discovering it on a device.
      - name: Install pinned NDK and verify its libc++
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_VER="$(grep -oE 'ndkVersion = "[^"]+"' "$GITHUB_WORKSPACE/mobile/android/build.gradle" | head -1 | cut -d'"' -f2)"
          echo "pinned ndkVersion = $NDK_VER"
          if [ ! -d "$SDK/ndk/$NDK_VER" ]; then
            SDKMANAGER="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)"
            [ -n "$SDKMANAGER" ] || { echo "sdkmanager not found"; exit 1; }
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "ndk;$NDK_VER"
          fi
          STL="$SDK/ndk/$NDK_VER/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          [ -f "$STL" ] || { echo "no libc++_shared.so in NDK $NDK_VER"; exit 1; }
          echo "comment: $(readelf -p .comment "$STL" 2>/dev/null | grep -o 'clang version [0-9.]*' | head -1)"
          if readelf --dyn-syms --wide "$STL" | grep -q '__cxa_init_primary_exception'; then
            echo "OK: NDK $NDK_VER libc++ exports __cxa_init_primary_exception"
          else
            echo "FAIL: NDK $NDK_VER libc++ does NOT export __cxa_init_primary_exception."
            echo "libNitroModules.so imports it; the app would crash at dlopen. Pin a newer NDK."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
          cache-read-only: false
          cache-cleanup: on-success

      - name: Build standalone diagnostic APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.repository.max.retries=5
            -Dorg.gradle.internal.repository.initial.backoff=2000
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if gradle --no-daemon --stacktrace :app:assembleDiagnostic; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle attempt ${attempt} failed; waiting before retry..."
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Native ABI guard
        run: |
          sh "$GITHUB_WORKSPACE/.github/scripts/abi-guard.sh" \
            "$GITHUB_WORKSPACE/mobile/android/app/build/outputs/apk/diagnostic/app-diagnostic.apk"

      - name: Verify diagnostic APK contains React Native bundle
        working-directory: mobile/android
        run: |
          set -e
          APK="app/build/outputs/apk/diagnostic/app-diagnostic.apk"
          test -f "$APK"
          echo "Inspecting $APK"
          if ! unzip -l "$APK" | grep -Eq 'assets/(index\.android\.bundle|index\.android\.bundle\.packager\.map)$'; then
            echo "ERROR: React Native Android bundle is missing from diagnostic APK."
            echo "APK assets containing bundle/map entries:"
            unzip -l "$APK" | grep -E 'assets/|bundle|\.map' | head -80 || true
            exit 1
          fi
          echo "React Native Android bundle is present in diagnostic APK."

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: zaycomm-diagnostic-apk
          path: mobile/android/app/build/outputs/apk/diagnostic/app-diagnostic.apk
          if-no-files-found: error
