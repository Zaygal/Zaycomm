name: Finalize C12 C14
on:
  push:
    branches: [Test]
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message != 'fix: finalize C12 multi-hop ACK binding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: Test, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Apply C12 and node send path
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routing/routing.ts'); s=p.read_text()
          old="""        const peer = this.authenticatedPeers.get(pending.neighborId);\n        if (!peer || !bytesEqual(peer.identityPublicKey, verifiedAck.signerPublicKey)) return { outcome: 'dropped', reason: 'ack route provenance mismatch' };\n        this.routingTable.markValidated(pending.destinationHint, verifiedAck.signerPublicKey, pending.neighborId, peer.identityPublicKey, peer.establishedAt);"""
          new="""        const peer = this.authenticatedPeers.get(pending.neighborId);\n        if (!peer) return { outcome: 'dropped', reason: 'ack route provenance mismatch' };\n        // C12: destination signer proves delivery; authenticated neighbor proves the relay path.\n        this.routingTable.markValidated(pending.destinationHint, verifiedAck.signerPublicKey, pending.neighborId, peer.identityPublicKey, peer.establishedAt);"""
          if old not in s: raise SystemExit('C12 pattern not found')
          s=s.replace(old,new,1)
          marker="  receiveEnvelope(envelope: Envelope, fromNodeId: string | null): DeliveryResult {"
          method="""  /** Send a packet through an authenticated direct or routed mesh path. */\n  sendEnvelope(envelope: Envelope): DeliveryResult {\n    this.purgeStaleRoutingState();\n    if (!validateRoutingHeader(envelope.header)) return { outcome: 'dropped', reason: 'invalid header' };\n    const direct = Array.from(this.authenticatedPeers.entries()).find(([id, peer]) =>\n      bytesEqual(computeDestinationHint(peer.identityPublicKey), envelope.header.destinationHint)\n    )?.[0];\n    const nextHopId = direct ?? this.routingTable.lookup(envelope.header.destinationHint, this.neighborTrust, this.authenticatedPeers);\n    if (nextHopId && this.forwardOverTransport(envelope, nextHopId)) return { outcome: 'forwarded', to: nextHopId };\n    const stored = this.queue.store(envelope, 'origin');\n    return stored.stored ? { outcome: 'queued' } : { outcome: 'dropped', reason: stored.reason ?? 'unknown' };\n  }\n\n"""
          if marker not in s: raise SystemExit('send insertion point not found')
          p.write_text(s.replace(marker,method+marker,1))
          PY
      - name: Verify
        run: |
          npm ci
          npx vitest run test/c12-routing-trust-binding.test.ts test/c14-sync-confidentiality.test.ts
          npx vitest run
      - name: Commit verified change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routing/routing.ts
          git commit -m 'fix: finalize C12 multi-hop ACK binding'
          git push origin Test
          git rm .github/workflows/finalize-c12-c14.yml
          git commit -m 'chore: remove temporary C12 C14 finalization workflow'
          git push origin Test
