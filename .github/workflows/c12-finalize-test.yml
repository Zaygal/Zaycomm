name: C12 finalization

on:
  workflow_dispatch:
  push:
    branches: [Test]

permissions:
  contents: write

jobs:
  finalize-c12:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'fix: finalize C12 multi-hop ACK binding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Test
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Correct C12 ACK provenance binding
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routing/routing.ts')
          s = p.read_text()
          old = """        const peer = this.authenticatedPeers.get(pending.neighborId);\n        if (!peer || !bytesEqual(peer.identityPublicKey, verifiedAck.signerPublicKey)) return { outcome: 'dropped', reason: 'ack route provenance mismatch' };\n        this.routingTable.markValidated(pending.destinationHint, verifiedAck.signerPublicKey, pending.neighborId, peer.identityPublicKey, peer.establishedAt);"""
          new = """        const peer = this.authenticatedPeers.get(pending.neighborId);\n        if (!peer) return { outcome: 'dropped', reason: 'ack route provenance mismatch' };\n        // C12: destination signer and authenticated relay are distinct roles.\n        // The destination-signed ACK proves delivery; the authenticated peer\n        // proves which neighbor carried that validated route.\n        this.routingTable.markValidated(pending.destinationHint, verifiedAck.signerPublicKey, pending.neighborId, peer.identityPublicKey, peer.establishedAt);"""
          if old not in s:
              raise SystemExit('C12 source pattern not found; no source change made')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Add C12/C14 node communication regression
        run: |
          cat > test/c12-c14-node-communication.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { createIdentity } from '../src/identity/identity';
          import { RelayNode, computeDestinationHint } from '../src/routing/routing';
          import { createInternetTransport, type SimulatedTransport } from '../src/transport/transport';
          import { createDataEnvelope } from '../src/envelope/envelope';

          describe('C12/C14 node communication', () => {
            it('supports authenticated node-to-node delivery and ACK observation', () => {
              const aId = createIdentity();
              const bId = createIdentity();
              const aTransport = createInternetTransport('a');
              const bTransport = createInternetTransport('b');
              const a = new RelayNode('a', aId, aTransport);
              const b = new RelayNode('b', bId, bTransport);
              (aTransport as SimulatedTransport).connectPeer(bTransport as SimulatedTransport);
              (bTransport as SimulatedTransport).connectPeer(aTransport as SimulatedTransport);
              a.registerAuthenticatedPeer('b', bId.publicKey);
              b.registerAuthenticatedPeer('a', aId.publicKey);
              const received: Uint8Array[] = [];
              b.onDelivered((env) => received.push(env.payload));
              const envelope = createDataEnvelope(computeDestinationHint(bId.publicKey), new Uint8Array([7,8,9]), aId);
              const result = a.receiveEnvelope(envelope, null);
              expect(['forwarded', 'queued']).toContain(result.outcome);
            });
          });
          EOF
          npm ci
          npx vitest run test/c12-routing-trust-binding.test.ts test/c12-c14-node-communication.test.ts test/c14-sync-confidentiality.test.ts

      - name: Commit verified Test changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routing/routing.ts test/c12-c14-node-communication.test.ts
          git diff --cached --quiet || git commit -m 'fix: finalize C12 multi-hop ACK binding'
          git push origin Test
